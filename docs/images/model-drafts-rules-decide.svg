<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Continental Divide architecture: a model drafts an event definition, deterministic rules and a human decide.">
  <defs>
    <style>
      .bg    { fill: #FBFAF7; }
      .box   { fill: #FFFFFF; stroke: #D6D2C8; stroke-width: 1.5; }
      .boxhi { fill: #FFFFFF; stroke: #1F4D3A; stroke-width: 2; }
      .chip  { fill: #EFF3F0; stroke: #C4D2CA; stroke-width: 1; }
      .bar   { fill: #1F4D3A; }
      .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 650; fill: #16211C; }
      .sub   { font-size: 13.5px; fill: #5C6660; }
      .h     { font-size: 14.5px; font-weight: 650; fill: #16211C; }
      .b     { font-size: 12px; fill: #5C6660; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1F4D3A; }
      .chipt { font-size: 11.5px; font-weight: 600; fill: #1F4D3A; }
      .barh  { font-size: 13.5px; font-weight: 650; fill: #FFFFFF; }
      .bart  { font-size: 12px; fill: #CFE0D6; }
      .divl  { font-size: 11px; font-weight: 700; fill: #9A5B33; letter-spacing: 1.4px; }
      .note  { font-size: 12px; fill: #5C6660; }
      .arrow { stroke: #9BA5A0; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9BA5A0"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="500"/>

  <text class="t title" x="24" y="40">The model drafts. The rules decide.</text>
  <text class="t sub" x="24" y="64">Continental Divide routes a plain-language tracking request across a fixed line. Nothing crosses it on a model&#8217;s say-so.</text>

  <line x1="432" y1="104" x2="432" y2="344" stroke="#9A5B33" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="t divl" x="432" y="96" text-anchor="middle">THE DIVIDE</text>
  <text class="t b" x="432" y="362" text-anchor="middle" fill="#9A5B33">rules.py contains no model call</text>

  <rect class="box" x="24" y="150" width="168" height="140" rx="8"/>
  <text class="t h" x="42" y="180">1. Intake</text>
  <text class="t b" x="42" y="206">Anyone in the</text>
  <text class="t b" x="42" y="224">business describes</text>
  <text class="t b" x="42" y="242">the event they want,</text>
  <text class="t b" x="42" y="260">in plain English.</text>
  <text class="t mono" x="42" y="282">POST /requests</text>

  <rect class="box" x="214" y="150" width="186" height="140" rx="8"/>
  <text class="t h" x="232" y="180">2. Model draft</text>
  <text class="t b" x="232" y="206">Anthropic API,</text>
  <text class="t b" x="232" y="224">server-side. Proposes</text>
  <text class="t b" x="232" y="242">a typed, schema-valid</text>
  <text class="t b" x="232" y="260">definition, or fails</text>
  <text class="t b" x="232" y="278">loudly with reasons.</text>

  <rect class="boxhi" x="464" y="150" width="224" height="140" rx="8"/>
  <text class="t h" x="482" y="180">3. Deterministic rules</text>
  <rect class="chip" x="482" y="194" width="68" height="24" rx="12"/>
  <text class="t chipt" x="516" y="210" text-anchor="middle">Naming</text>
  <rect class="chip" x="558" y="194" width="48" height="24" rx="12"/>
  <text class="t chipt" x="582" y="210" text-anchor="middle">PII</text>
  <rect class="chip" x="614" y="194" width="56" height="24" rx="12"/>
  <text class="t chipt" x="642" y="210" text-anchor="middle">Dupes</text>
  <text class="t b" x="482" y="242">Exact is fact. Near is</text>
  <text class="t b" x="482" y="260">judgment. Semantic is an</text>
  <text class="t b" x="482" y="278">argument, not a veto.</text>

  <rect class="boxhi" x="710" y="150" width="190" height="140" rx="8"/>
  <text class="t h" x="728" y="180">4. Human</text>
  <text class="t b" x="728" y="206">Requester answers first,</text>
  <text class="t b" x="728" y="224">then an approver signs.</text>
  <text class="t b" x="728" y="250">Every PII or duplicate</text>
  <text class="t b" x="728" y="268">flag must be acknow-</text>
  <text class="t b" x="728" y="286">ledged by name.</text>

  <rect class="box" x="922" y="150" width="154" height="140" rx="8"/>
  <text class="t h" x="940" y="180">5. Publish</text>
  <text class="t b" x="940" y="206">Docs page and a</text>
  <text class="t b" x="940" y="224">ticket, on approval.</text>
  <text class="t b" x="940" y="250">The event lands in</text>
  <text class="t b" x="940" y="268">the catalog.</text>

  <line class="arrow" x1="196" y1="220" x2="210" y2="220" marker-end="url(#a)"/>
  <line class="arrow" x1="404" y1="220" x2="458" y2="220" marker-end="url(#a)"/>
  <line class="arrow" x1="692" y1="220" x2="706" y2="220" marker-end="url(#a)"/>
  <line class="arrow" x1="904" y1="220" x2="918" y2="220" marker-end="url(#a)"/>

  <rect class="bar" x="24" y="390" width="1052" height="58" rx="8"/>
  <text class="t barh" x="44" y="416">Append-only audit log</text>
  <text class="t bart" x="44" y="436">What was requested, what the model proposed, which rules passed or failed, who decided, and when. Rows cannot be edited or deleted.</text>

  <text class="t note" x="24" y="474">Rules read a versioned YAML governance profile. Changing them is a commit, never the same screen as the request it would have let through.</text>
</svg>
