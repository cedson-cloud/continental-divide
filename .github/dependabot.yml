# Version updates for GitHub Actions and npm, once a month, one grouped PR each.
# Nothing merges on its own: every PR runs CI and waits for a person.
version: 2
updates:
  # Action majors are runtime bumps that CI exercises on the PR itself, so they
  # are not held back.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt sets minimums, so pip already installs the newest allowed
  # release and a version update would only raise a floor. Dependabot also
  # opened these one package per PR, ignoring the group. 0 turns version
  # updates off for pip; security updates still come from the repository
  # setting. anthropic stays below 1.0 through its own "<1".
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A major upgrade is its own task. next stays on 15.5.x.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
