# PostHog-style snake_case event names: user_signed_up, not "User Signed Up".
# Everything except the naming convention is inherited from the Segment template.
version: 1
name: posthog-snake-case
# snake_case object_action follows PostHog's SDK examples. PostHog's published naming
# guidance is category:object_action, lowercase, present tense:
# https://posthog.com/docs/product-analytics/best-practices
# That convention will be added as its own option.
source: https://posthog.com/docs/libraries/python
extends: segment-ecommerce.yaml
platform: posthog

event_naming:
  convention: snake_case_object_action
